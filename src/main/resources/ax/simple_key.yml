# 星契 StarPact — 简单按键（ArcartX simple_key）
#
# 为什么用 simple_key 而不是 client_key + key_group：
#   client_key 是「按住持续触发」型 —— 每 tick 发一次 key_hold，
#   按一下 J（物理时长约 1 秒）会触发 3~10 次，导致面板被反复打开、
#   UI 反复重建（表现为闪烁、有时按了没反应）。
#   simple_key 是「按一次触发一次」，正是我们要的。
#
# 代价：这个键不会出现在「选项 → 按键设置」里供玩家自定义，
# 它是固定绑定。要改键就改下面的 keys。
#
# 执行的是 /starpact panel，走插件完整流程（open + 推数据）。
# 注意用全称：简写 /sp 已被 StarTrail 占用。

星契任务面板:
  keys:
    - "J"
  trigger:
    - "星契打开面板"
