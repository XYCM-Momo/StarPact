# 星契 StarPact — 按键组（ArcartX key_group）
#
# 监听 client_key 注册的「星契任务面板」按键，按下时执行下面的 trigger。
#
# interval（毫秒）：两次触发之间的最短间隔。
#   client_key 是「按住持续触发」型，不加间隔会导致按一下 J 连开好几次面板。
#   300ms 足够吸收连发（正常按键间隔 50~100ms），又不影响「关掉面板马上再开」。
#   代码里还有一层 400ms 防抖，双重保险。

星契任务面板组:
  keys:
    - "星契任务面板"
  interval: 300
  trigger:
    - "星契打开面板"