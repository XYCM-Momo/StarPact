# 星契 StarPact — 任务面板按键（ArcartX 客户端按键）
#
# 这个文件由 StarPact 插件在启用时自动生成到 plugins/ArcartX/key_bind/client_key/，
# 请**不要手动删除**，否则 J 键会失效（删掉后重启服务端会自动重建）。
#
# 它是「注册按键到客户端按键表」的配置：只负责让 J 出现在
# 「选项 → 按键设置 → 星契 StarPact」里，本身不触发任何逻辑。
# 真正的触发由同目录上两级的 key_group/星契.yml 负责。
#
# 玩家可以在这里把 J 改成任何自己顺手的键。

星契任务面板:
  category: "星契 StarPact"   # 客户端按键设置里显示的分类名
  default: "J"                # 默认按键；玩家可自行修改
