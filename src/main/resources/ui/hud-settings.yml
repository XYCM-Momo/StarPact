# 星契 StarPact — HUD 设置面板（HUD 类型，独立于任务面板）
#
# 点任务面板里的「打开 HUD 设置」→ 关闭任务面板 + 打开这个 HUD。
# 这样玩家能同时看到 HUD 和设置项，实时调整。
#
# 坐标全部基于 Screen.getWidth()，任何分辨率比例恒定。
# 尺寸保持正方形/固定比例的控件用同一基准（宽度）。
#
# ⚠️ Aria 约定：脚本里不写注释、不用 if 块、布尔发 1/0。

ui:
  isHud: "false"
  show: "true"
  defaultOpen: false
  screenScale: false
  background: true
  escClose: true

  action:
    open: |-
      Packet.send('starpact:hudset_ready')

  packetHandler:
    sync: |-
      var.SW = Screen.getWidth()
      var.SH = Screen.getHeight()
      var.PW = var.SW * 0.5200
      var.PAD = var.SW * 0.0200
      var.LBL_W = var.SW * 0.1150
      var.BTN_W = var.SW * 0.0990
      var.GAP = var.SW * 0.0090
      var.VAL_W = var.SW * 0.1000
      var.ROW_H = var.SH * 0.0550
      var.LEFT = -var.PW / 2 + var.PAD
      var.BTN_X = -var.SW * 0.0700
      var.BTN2_X = var.BTN_X + var.BTN_W + var.GAP
      var.SINGLE_W = var.BTN_W * 2 + var.GAP
      var.SINGLE_X = var.BTN_X + var.SINGLE_W / 2 - var.BTN_W / 2
      var.VAL_X = var.SW * 0.1500
      var.CLOSE_X = var.PW / 2 - var.PAD - var.SW * 0.0110

      val.hs_bg.width = var.PW
      val.hs_bg.height = var.SH * 0.6200
      var.LABEL_X = var.LEFT + var.LBL_W / 2
      val.hs_title.width = var.LBL_W
      val.hs_title.x = var.LABEL_X
      val.hs_l1.x = var.LABEL_X
      val.hs_l2.x = var.LABEL_X
      val.hs_l3.x = var.LABEL_X
      val.hs_l4.x = var.LABEL_X
      val.hs_l5.x = var.LABEL_X
      val.hs_l6.x = var.LABEL_X
      val.hs_close.x = var.CLOSE_X
      val.hs_b1.x = var.SINGLE_X
      val.hs_b1.width = var.SINGLE_W
      val.hs_b4.x = var.SINGLE_X
      val.hs_b4.width = var.SINGLE_W
      val.hs_v1.x = var.VAL_X
      val.hs_v2.x = var.VAL_X

      val.hs_bg.visible = packet['show']
      val.hs_title.visible = packet['show']
      val.hs_close.visible = packet['show']
      val.hs_l1.visible = packet['show']
      val.hs_l2.visible = packet['show']
      val.hs_l3.visible = packet['show']
      val.hs_l4.visible = packet['show']
      val.hs_l5.visible = packet['show']
      val.hs_l6.visible = packet['show']
      val.hs_b1.visible = packet['show']
      val.hs_b2.visible = packet['show']
      val.hs_b3.visible = packet['show']
      val.hs_b4.visible = packet['show']
      val.hs_b5.visible = packet['show']
      val.hs_b6.visible = packet['show']
      val.hs_b2r.visible = packet['show']
      val.hs_b3r.visible = packet['show']
      val.hs_b5r.visible = packet['show']
      val.hs_b6r.visible = packet['show']
      val.hs_v1.visible = packet['show']
      val.hs_v2.visible = packet['show']
      val.hs_v1.texts = [packet['v1']]
      val.hs_v2.texts = [packet['v2']]

controls:
  hs_bg:
    val: "hs_bg"
    type: Texture
    attribute:
      point: ~middle_center
      visible: false
      x: Screen.getWidth() * 0.0000
      y: Screen.getHeight() * 0.0000
      width: Screen.getWidth() * 0.5200
      height: Screen.getHeight() * 0.6200
      normal: ~10,12,18,235
      shape: ~round_rect
      radius: 8
  hs_title:
    val: "hs_title"
    type: Text
    attribute:
      point: ~middle_center
      visible: false
      x: Screen.getWidth() * -0.2050
      y: Screen.getHeight() * -0.2600
      width: Screen.getWidth() * 0.1800
      height: Screen.getHeight() * 0.0600
      fontSize: Screen.getWidth() * 0.024
      texts:
        - ~&7▎HUD 设置

  hs_close:
    val: "hs_close"
    type: Texture
    attribute:
      point: ~middle_center
      visible: false
      x: Screen.getWidth() * 0.2150
      y: Screen.getHeight() * -0.2650
      width: Screen.getWidth() * 0.0420
      height: Screen.getWidth() * 0.0420
      normal: ~0,0,0,0
      hover: ~70,40,45,150
      shape: ~circle
      texts:
        - ~&f×
      fontSize: Screen.getWidth() * 0.0280
      center: true
    action:
      click: |-
        Packet.send('starpact:hudset_close')
    effect:
      stroke:
        width: 1
        color: ~200,90,100,220

