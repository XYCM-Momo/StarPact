# 星契 StarPact — 对话面板（仿原神风格，覆盖 Chemdah 的箱子对话）
#
# ══════════════════════════════════════════════════════════════
# 原理
# ══════════════════════════════════════════════════════════════
# Chemdah 的 theme-chest 对话本质是一个原版箱子：
#   slot 10      → 书，名字是 NPC 名，lore 是台词
#   slot 12..43  → 纸，每张是一个选项
# 把 ui.match 设为箱子标题（Chemdah 那边 theme-chest.ui.title 已改成
# 固定值 "StarPactChat"），AX 就会用本 UI 盖住它。
#
# ══════════════════════════════════════════════════════════════
# 布局（仿原神）
# ══════════════════════════════════════════════════════════════
#   ┌─────────────────────────────────────────────────┐
#   │                                                 │
#   │                    （游戏画面）                   │
#   │                              ┌─────────────────┐│
#   │                              │  1. 我想打听点事 ││  ← 选项：右侧竖排
#   │                              │  2. 再见        ││
#   │                              └─────────────────┘│
#   │                                                 │
#   │▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔│  ← 底部渐变遮罩
#   │  江小满                                          │  ← NPC 名（金色）
#   │  登记上是阿贝。你进去看看，我在门口等你。            │  ← 台词（白色大字）
#   └─────────────────────────────────────────────────┘
#
# ⚠️ 所有控件都用 top_left 绝对坐标（middle_center 下 x/y 是中心偏移，
#    很容易把「左边缘」当 x 写，结果整体偏移半个宽度 —— 这里踩过）。
#
ui:
  # 用箱子标题把它盖住 —— Chemdah 会自己打开那个箱子，绝不希望它被看见。
  # 点击走的是本面板自己的选项控件（chat_pick），不依赖箱子。
  match:
    - "StarPactChat"
  # 对话时隐藏原版 HUD，让画面只剩对话本身
  hide:
    - hotbar            # 物品栏
    - chat_panel        # 聊天栏
    - player_state      # 血量/饥饿/经验（1.20.1+ 合集）
    - player_health
    - armor_level
    - food_level
    - air_level
    - experience_bar
    - crosshair         # 准星
    - item_name         # 手持物品名
    - scoreboard        # 计分板
  isHud: "false"
  background: false
  through: "true"
  escClose: "true"
  closeDied: "true"
  show: "true"
  screenScale: false
  defaultOpen: false

  action:
    open: |-
      Packet.send('starpact:chat_ready')

  packetHandler:
    sync: |-
      var.SW = Screen.getWidth()
      var.SH = Screen.getHeight()

      var.BOT = var.SH * 0.3400
      var.TOP = var.SH - var.BOT
      var.PAD = var.SW * 0.0550
      var.TW = var.SW * 0.6000

      val.shade.width = var.SW
      val.shade.height = var.BOT
      val.shade.x = 0
      val.shade.y = var.TOP

      var.TX = (var.SW - var.TW) * 0.5

      val.name.width = var.TW
      val.name.height = var.SH * 0.0400
      val.name.x = var.TX
      val.name.y = var.TOP + var.BOT * 0.0700
      val.name.texts = [packet['npc_name']]

      val.line.width = var.TW * 0.1200
      val.line.height = 1
      val.line.x = (var.SW - var.TW * 0.1200) * 0.5
      val.line.y = var.TOP + var.BOT * 0.2400

      var.LH = var.BOT * 0.1050
      var.LY = var.TOP + var.BOT * 0.3200

      var.EM = 17 * 0.435
      var.TEM = packet['text_em']
      if (var.TEM == null) {
        var.TEM = 0
      }
      var.TPIX = var.TEM * var.EM
      if (var.TPIX < var.EM * 6) {
        var.TPIX = var.EM * 6
      }

      val.text1.width = var.TPIX
      val.text1.height = var.LH
      val.text1.x = (var.SW - var.TPIX) * 0.5
      val.text1.y = var.LY
      val.text1.texts = [packet['npc_1']]

      val.text2.width = var.TPIX
      val.text2.height = var.LH
      val.text2.x = (var.SW - var.TPIX) * 0.5
      val.text2.y = var.LY + var.LH * 1.15
      val.text2.texts = [packet['npc_2']]

      val.text3.width = var.TPIX
      val.text3.height = var.LH
      val.text3.x = (var.SW - var.TPIX) * 0.5
      val.text3.y = var.LY + var.LH * 2.30
      val.text3.texts = [packet['npc_3']]

      val.text4.width = var.TPIX
      val.text4.height = var.LH
      val.text4.x = (var.SW - var.TPIX) * 0.5
      val.text4.y = var.LY + var.LH * 3.45
      val.text4.texts = [packet['npc_4']]

      val.skip_area.x = 0
      val.skip_area.y = var.TOP
      val.skip_area.width = var.SW - var.SW * 0.3600
      val.skip_area.height = var.BOT
      val.skip_area.visible = packet['ready']

      var.OW = var.SW * 0.2600
      var.FS = 16
      var.OH = var.SH * 0.0680
      var.OG = var.SH * 0.0200
      var.OX = var.SW - var.OW - var.SW * 0.0350

      var.BASE = var.TOP - (var.OH * 6 + var.OG * 5) * 0.55

      val.opt_bg0.width = var.OW
      val.opt_bg0.height = var.OH
      val.opt_bg0.x = var.OX
      val.opt_bg0.y = var.BASE
      val.opt_bg0.texts = [packet['t0']]

      val.opt_bg1.width = var.OW
      val.opt_bg1.height = var.OH
      val.opt_bg1.x = var.OX
      val.opt_bg1.y = var.BASE + (var.OH + var.OG)
      val.opt_bg1.texts = [packet['t1']]

      val.opt_bg2.width = var.OW
      val.opt_bg2.height = var.OH
      val.opt_bg2.x = var.OX
      val.opt_bg2.y = var.BASE + (var.OH + var.OG) * 2
      val.opt_bg2.texts = [packet['t2']]

      val.opt_bg3.width = var.OW
      val.opt_bg3.height = var.OH
      val.opt_bg3.x = var.OX
      val.opt_bg3.y = var.BASE + (var.OH + var.OG) * 3
      val.opt_bg3.texts = [packet['t3']]

      val.opt_bg4.width = var.OW
      val.opt_bg4.height = var.OH
      val.opt_bg4.x = var.OX
      val.opt_bg4.y = var.BASE + (var.OH + var.OG) * 4
      val.opt_bg4.texts = [packet['t4']]

      val.opt_bg5.width = var.OW
      val.opt_bg5.height = var.OH
      val.opt_bg5.x = var.OX
      val.opt_bg5.y = var.BASE + (var.OH + var.OG) * 5
      val.opt_bg5.texts = [packet['t5']]

      val.shade.visible = packet['ready']
      val.name.visible = packet['ready']
      val.line.visible = packet['ready']
      val.text1.visible = packet['ready']
      val.text2.visible = packet['ready']
      val.text3.visible = packet['ready']
      val.text4.visible = packet['ready']
      var.o0 = 0
      if (packet['ready'] == 1 && packet['v0'] == 1 && packet['typing'] == 0) {
        var.o0 = 1
      }
      val.opt_bg0.visible = var.o0
      var.o1 = 0
      if (packet['ready'] == 1 && packet['v1'] == 1 && packet['typing'] == 0) {
        var.o1 = 1
      }
      val.opt_bg1.visible = var.o1
      var.o2 = 0
      if (packet['ready'] == 1 && packet['v2'] == 1 && packet['typing'] == 0) {
        var.o2 = 1
      }
      val.opt_bg2.visible = var.o2
      var.o3 = 0
      if (packet['ready'] == 1 && packet['v3'] == 1 && packet['typing'] == 0) {
        var.o3 = 1
      }
      val.opt_bg3.visible = var.o3
      var.o4 = 0
      if (packet['ready'] == 1 && packet['v4'] == 1 && packet['typing'] == 0) {
        var.o4 = 1
      }
      val.opt_bg4.visible = var.o4
      var.o5 = 0
      if (packet['ready'] == 1 && packet['v5'] == 1 && packet['typing'] == 0) {
        var.o5 = 1
      }
      val.opt_bg5.visible = var.o5

tasks:
  # 分辨率变化检测。
  # sync 只在服务端推数据时执行，玩家切换分辨率/窗口大小后坐标不会重算，
  # 界面就会错位。这里每 0.5 秒比一次屏幕尺寸，变了就让服务端重推一次数据
  # （重推会带着完整数据跑一遍 sync，布局自然按新尺寸重算）。
  resize_watch:
    type: loop
    time: 0
    cycle: 500
    run: |-
      var.nw = Screen.getWidth()
      var.nh = Screen.getHeight()
      var.ow = 0
      var.oh = 0
      if (val.shade.lastW != null) {
        var.ow = val.shade.lastW
      }
      if (val.shade.lastH != null) {
        var.oh = val.shade.lastH
      }
      if (var.nw != var.ow || var.nh != var.oh) {
        val.shade.lastW = var.nw
        val.shade.lastH = var.nh
        Packet.send('starpact:chat_resize')
      }

controls:
  # 底部渐变遮罩：原神用一条从透明到深色的横条，让文字在任何画面上都看得清
  shade:
