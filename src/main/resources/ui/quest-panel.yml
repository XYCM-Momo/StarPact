# 星契 StarPact — 任务面板（全屏 Menu，按 J 打开）
#
# 布局：
#   ┌──────────────────────────────────────────────────┐
#   │ [时序][间章][残流]  页名            [⚙][×]       │ 顶栏
#   ├──────────────────────────────────────────────────┤ 分割线
#   │ 任务列表 │ 任务详情                                │
#   │          ├──────────────────────────────────────────┤
#   │          │ 奖励                                     │
#   └──────────────────────────────────────────────────┘
#
# ⚠️ Aria 脚本硬性约定（违反会导致整段脚本被丢弃）
#   1) 脚本里绝不写注释（// 和 # 都不行）
#   2) 不用 if 块，用数学运算或拆成多个赋值
#   3) 动态文本必须用 § 色码，不能带 ~ 前缀、不能用 &
#   4) 包里的布尔会变字符串 "false"（非空=真）→ 服务端发 1/0
#   5) 可点击控件必须有非零 width/height
#   6) normal/x/y 这些属性运行时不可写（只有 alpha/visible/texts/
#      fontSize/width/height/scale/radius/point 可写）
#
# 图标：客户端 resourcepacks/ArcartX/resource/starpact/gui/*.png
# ══════════════════════════════════════════════════════════

ui:
  isHud: "false"
  background: true
  escClose: true
  closeDied: true
  jei: "false"
  show: "true"
  screenScale: false
  defaultOpen: false

  action:
    open: |-
      Packet.send('starpact:ready')

  packetHandler:
    sync: |-
      val.page_name.texts = [packet['page_name']]

      val.quest_list.texts = packet['quest_lines']
      val.detail.texts = packet['detail_lines']
      val.reward.texts = packet['reward_lines']
      val.tab_shixu_bg.visible = packet['tab_shixu_on']
      val.tab_jian_bg.visible = packet['tab_jian_on']
      val.tab_can_bg.visible = packet['tab_can_on']
      var.LR_RATIO = packet['left_ratio'] + 0
      var.ui = packet['ui_scale'] + 0

      var.SW = Screen.getWidth()
      var.SH = Screen.getHeight()

      var.PAD = var.SW * 0.014
      var.ICON = var.SW * 0.048
      var.ICON_GAP = var.SW * 0.012
      var.TOP_H = var.SW * 0.075
      var.SMALL = var.SW * 0.040
      var.BTN_GAP = var.SW * 0.012

      var.TAB1_X = var.PAD
      var.TAB2_X = var.TAB1_X + var.ICON + var.ICON_GAP
      var.TAB3_X = var.TAB2_X + var.ICON + var.ICON_GAP
      var.TAB_Y = var.SW * 0.008
      var.NAME_X = var.TAB3_X + var.ICON + var.ICON_GAP * 2
      var.CLOSE_X = var.PAD
      var.SET_X = var.PAD

      var.LEFT_W = var.SW * var.LR_RATIO
      var.LIST_X = var.PAD
      var.DIV_X = var.LIST_X + var.LEFT_W
      var.DETAIL_X = var.DIV_X + var.PAD
      var.DETAIL_W = var.SW - var.DETAIL_X - var.PAD
      var.CONTENT_Y = var.TOP_H + var.SW * 0.015
      var.CONTENT_H = var.SH - var.CONTENT_Y - var.PAD
      var.REWARD_H = var.SH * 0.085
      var.REWARD_Y = var.SH - var.REWARD_H - var.PAD
      var.RTITLE_Y = var.REWARD_Y - var.SH * 0.060
      var.DETAIL_H = var.RTITLE_Y - var.CONTENT_Y - var.SW * 0.008

      val.tab_shixu.x = var.TAB1_X
      val.tab_jian.x = var.TAB2_X
      val.tab_can.x = var.TAB3_X
      val.tab_shixu.y = var.TAB_Y
      val.tab_jian.y = var.TAB_Y
      val.tab_can.y = var.TAB_Y
      val.tab_shixu.width = var.ICON
      val.tab_shixu.height = var.ICON
      val.tab_jian.width = var.ICON
      val.tab_jian.height = var.ICON
      val.tab_can.width = var.ICON
      val.tab_can.height = var.ICON

      var.BG_PAD = var.ICON * 0.10
      var.BG_SZ = var.ICON + var.BG_PAD * 2
      val.tab_shixu_bg.x = var.TAB1_X - var.BG_PAD
      val.tab_shixu_bg.y = var.TAB_Y - var.BG_PAD
      val.tab_shixu_bg.width = var.BG_SZ
      val.tab_shixu_bg.height = var.BG_SZ
      val.tab_jian_bg.x = var.TAB2_X - var.BG_PAD
      val.tab_jian_bg.y = var.TAB_Y - var.BG_PAD
      val.tab_jian_bg.width = var.BG_SZ
      val.tab_jian_bg.height = var.BG_SZ
      val.tab_can_bg.x = var.TAB3_X - var.BG_PAD
      val.tab_can_bg.y = var.TAB_Y - var.BG_PAD
      val.tab_can_bg.width = var.BG_SZ
      val.tab_can_bg.height = var.BG_SZ
      val.tab_shixu.scale = var.ui
      val.tab_jian.scale = var.ui
      val.tab_can.scale = var.ui

      val.page_name.x = var.NAME_X
      val.page_name.y = var.SW * 0.020
      val.page_name.width = var.SW * 0.400

      val.btn_close.x = -var.PAD
      val.btn_close.y = var.SW * 0.010
      val.btn_close.width = var.SMALL
      val.btn_close.height = var.SMALL
      val.btn_setting.x = -var.PAD - var.SMALL - var.BTN_GAP
      val.btn_setting.y = var.SW * 0.010
      val.btn_setting.width = var.SMALL
      val.btn_setting.height = var.SMALL

      val.line_top.y = var.TOP_H
      val.quest_list.x = var.LIST_X
      val.quest_list.y = var.CONTENT_Y
      val.quest_list.width = var.LEFT_W - var.PAD
      val.quest_list.height = var.CONTENT_H
      val.line_left.x = var.DIV_X
      val.line_left.y = var.CONTENT_Y
      val.line_left.height = var.CONTENT_H
      val.detail.x = var.DETAIL_X
      val.detail.y = var.CONTENT_Y
      val.detail.width = var.DETAIL_W
      val.detail.height = var.DETAIL_H
      val.reward_title.x = var.DETAIL_X
      val.reward_title.y = var.RTITLE_Y
      val.reward.x = var.DETAIL_X
      val.reward.y = var.REWARD_Y
      val.reward.width = var.DETAIL_W
      val.reward.height = var.REWARD_H

      var.ss = packet['show_setting'] + 0
      val.detail.visible = var.ss < 1
      val.reward.visible = var.ss < 1
      val.reward_title.visible = var.ss < 1
      val.quest_list.visible = var.ss < 1
      val.line_left.visible = var.ss < 1
      val.row_uiz.visible = var.ss > 0
      val.btn_uiz_m.visible = var.ss > 0
      val.btn_uiz_p.visible = var.ss > 0
      val.val_uiz.visible = var.ss > 0
      val.row_content.visible = var.ss > 0
      val.btn_cont_m.visible = var.ss > 0
      val.btn_cont_p.visible = var.ss > 0
      val.val_content.visible = var.ss > 0
      val.row_left.visible = var.ss > 0
      val.btn_left_m.visible = var.ss > 0
      val.btn_left_p.visible = var.ss > 0
      val.val_left.visible = var.ss > 0
      val.btn_hudmode.visible = var.ss > 0
      val.val_uiz.texts = [packet['set_scale_text']]
      val.val_content.texts = [packet['set_content_text']]
      val.val_left.texts = [packet['set_left_text']]
      val.quest_list.scale = var.ui
      val.detail.scale = var.ui
      val.reward.scale = var.ui
      val.reward_title.scale = var.ui
      val.page_name.scale = var.ui
      val.btn_setting.scale = var.ui
      val.btn_close.scale = var.ui
      val.line_left.scale = var.ui

      var.pa = packet['panel_alpha'] + 0
      val.bg.alpha = var.pa
      val.content_bg.alpha = var.pa


