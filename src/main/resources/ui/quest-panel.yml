      val.reward_title.scale = var.ui
      val.page_name.scale = var.ui
      val.btn_setting.scale = var.ui
      val.btn_close.scale = var.ui
      val.line_left.scale = var.ui
      val.track_btn.width = var.SW * 0.1300
      val.track_btn.height = var.SH * 0.0620
      val.track_btn.x = var.DETAIL_X + var.DETAIL_W - var.SW * 0.1300
      val.track_btn.y = var.RTITLE_TOP + var.RTITLE_H - var.SH * 0.0620
      val.track_btn.scale = var.ui
      val.track_btn.visible = (packet['has_sel'] + 0 > 0) * (var.ss < 1)
      val.track_btn.tracked = packet['tracked'] + 0
      val.track_btn_label.texts = [packet['track_text']]
      val.track_btn_label.x = val.track_btn.x
