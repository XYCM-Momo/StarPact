      val.track_btn_label.width = var.SW * 0.1300
      val.track_btn_label.height = var.SH * 0.0620
      val.track_btn_label.scale = var.ui
      val.track_btn_label.visible = val.track_btn.visible
      val.rw_slot0.visible = (var.RR > 0) * (var.ss < 1)
