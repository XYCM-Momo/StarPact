      val.q_row1.height = var.LH
      val.q_row1.scale = var.ui
      val.q_row1.texts = [packet['qr_text1']]
      val.q_row1.visible = packet['qr_show1'] * (var.ss < 1)
      val.q_row2.x = var.LX
      val.q_row2.y = var.LY + var.LSTEP * 2
