# ══════════════════════════════════════════════════════════════
# 入场动画驱动
# ══════════════════════════════════════════════════════════════
# sync 只在数据变化时执行一次，而 Slide/Fade 需要「按帧取当前值」，
# 所以动画对象挂在 frame 控件上（sync 里创建），由这里每 40ms 求值一次。
# 不这么做的话，动画只会在 sync 那一瞬间求值一次，表现为卡住不动。

tasks:
  hud_fade:
    type: loop
    time: 0
    cycle: 40
    run: |-
      var.ph = 0
      if (val.frame.fadePhase != null) {
        var.ph = val.frame.fadePhase
      }
      var.pg = 0
      if (val.frame.fadeProg != null) {
        var.pg = val.frame.fadeProg
      }
      var.alp = 1
      var.nph = 0
      var.npg = 0
      var.isIn = var.ph == 1
      if (var.isIn) {
        var.alp = var.pg / 400
        var.nph = 1
        var.npg = var.pg + 40
      }
      var.done = var.npg >= 400
      if (var.done) {
        var.nph = 0
        var.npg = 0
      }
      var.isIdle = var.nph == 0
      if (var.isIdle) {
        var.alp = 1
      }
      val.frame.fadePhase = var.nph
      val.frame.fadeProg = var.npg
      val.panel.alpha = var.alp
      val.frame.alpha = var.alp
      val.header.alpha = var.alp
      val.s0.alpha = var.alp
      val.divider.alpha = var.alp
