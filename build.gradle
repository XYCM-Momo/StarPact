plugins {
    id 'java'
}

// ── 版本号唯一来源：src/main/resources/plugin.yml 里的 version ──
// （和 VERSIONING.md 的约定一致：插件版本写在 plugin.yml，不在这里手改）
def pluginYmlFile = file('src/main/resources/plugin.yml')
def versionMatcher = pluginYmlFile.text =~ /(?m)^version:\s*['"]?([^'"\s]+)['"]?\s*$/
version = versionMatcher.find() ? versionMatcher.group(1) : '0.0.0'
group = 'com.asterovie.momo.starpact'

// Chemdah / ArcartX 都是闭源插件，公共仓库里没有，
// 直接用 StarPact 工作区里那两份 jar 编译（compileOnly，不打包进我们的 jar）。
def chemdahJarFile = file(chemdah_jar)
if (!chemdahJarFile.exists()) {
    throw new GradleException(
        "找不到 Chemdah jar：${chemdahJarFile}\n" +
        "请把 gradle.properties 里的 chemdah_jar 改成工作区里实际的 Chemdah-*.jar 路径。")
}

def arcartxJarFile = file(arcartx_jar)
if (!arcartxJarFile.exists()) {
    throw new GradleException(
        "找不到 ArcartX jar：${arcartxJarFile}\n" +
        "请把 gradle.properties 里的 arcartx_jar 改成工作区里实际的 ArcartX-*.jar 路径。")
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Paper API：编译期用，不打包进 jar（服务端自带）
    compileOnly "io.papermc.paper:paper-api:${paper_api_version}"
    compileOnly files(chemdahJarFile)
    compileOnly files(arcartxJarFile)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    archiveBaseName = 'StarPact-Plugin'
    // 可复现构建：同样源码 => 逐字节相同的 jar（和 StarTrail 保持一致）
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes(
                'Implementation-Title': 'StarPact Plugin',
                'Implementation-Version': project.version
        )
    }
}

// 编译完顺手报一下产物，方便确认
tasks.register('showJar') {
    dependsOn tasks.named('jar')
    doLast {
        def f = tasks.named('jar').get().archiveFile.get().asFile
        println "产物: ${f}  (${f.length()} 字节)"
    }
}
