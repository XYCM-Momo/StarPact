plugins {
    id 'java'
}

// ── 版本号唯一来源：src/main/resources/plugin.yml 里的 version ──
// （和 VERSIONING.md 的约定一致：插件版本写在 plugin.yml，不在这里手改）
def pluginYmlFile = file('src/main/resources/plugin.yml')
def versionMatcher = pluginYmlFile.text =~ /(?m)^version:\s*['"]?([^'"\s]+)['"]?\s*$/
version = versionMatcher.find() ? versionMatcher.group(1) : '0.0.0'
group = 'com.asterovie.momo'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT"
    // Chemdah / ArcartX 都是闭源插件，公共仓库里没有。
    // 把对应的 jar 放进 libs/ 即可编译（compileOnly，不会打包进我们的 jar）。
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: version)
    }
}

jar {
    archiveBaseName = 'StarPact-Plugin'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes(
            'Implementation-Title': 'StarPact',
            'Implementation-Version': project.version
        )
    }
}