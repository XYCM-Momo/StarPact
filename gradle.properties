# NOTE: Gradle reads gradle.properties as ISO-8859-1, so this file must stay
#       pure ASCII. Chinese paths are written with \uXXXX escapes (Java
#       properties syntax) -- e.g. the JDK / plugin jar paths below.

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Compile with the JDK 17 bundled inside the StarTrail workspace
# (Paper 1.20.1 needs Java 17). <StarTrail>/tools/jdk-17.0.20.1+1
org.gradle.java.home=E:/Minecraft/\u670d\u52a1\u5668/\u63d2\u4ef6/StarTrail/tools/jdk-17.0.20.1+1

# ---- compile-time dependencies -------------------------------------------
# Paper API from https://repo.papermc.io/
paper_api_version=1.20.1-R0.1-SNAPSHOT

# Chemdah is a closed-source premium plugin, so we compile against the copy
# that ships in this workspace. Compile-only: never bundled into our jar.
chemdah_jar=E:/Minecraft/\u670d\u52a1\u5668/\u63d2\u4ef6/StarPact/[C][\u4efb\u52a1]Chemdah-1.1.33-FREE-MySQL.jar

# ArcartX server plugin: compile-only, used for the HUD UI API.
arcartx_jar=E:/Minecraft/\u670d\u52a1\u5668/\u63d2\u4ef6/StarPact/[V][\u56fe\u5f62]ArcartX-2.7.77.jar

# PlaceholderAPI (public artifact, but pinned locally to keep the build offline)
# Not required: we read Chemdah directly through its Java API.

